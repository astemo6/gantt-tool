<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户节点甘特图工具 v1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#1f2937;background:#f3f4f6;font-size:14px}
header{display:flex;align-items:center;gap:12px;background:#1f2937;color:#fff;padding:10px 16px;position:sticky;top:0;z-index:10}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
#projectName{background:#374151;border:1px solid #4b5563;color:#fff;border-radius:6px;padding:6px 10px;width:200px;font-size:13px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{background:#f59e0b;border:none;color:#1f2937;font-weight:600;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
button:hover{background:#fbbf24}
button.ghost{background:#374151;color:#e5e7eb}
button.ghost:hover{background:#4b5563}
.main{display:flex;height:calc(100vh - 53px)}
aside{width:344px;background:#fff;border-right:1px solid #e5e7eb;overflow-y:auto;padding:12px 14px;flex-shrink:0}
aside h3{font-size:13px;margin:16px 0 8px;color:#374151}
aside h3:first-child{margin-top:0}
aside select,aside input[type=date],aside input[type=text]{font-size:13px;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;width:100%;background:#fff}
.node-row{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap}
.noderef{margin-top:12px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;overflow-x:auto}
.noderef h3{margin:0 0 8px;font-size:13px}
.reftable{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.reftable th,.reftable td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
.reftable th{background:#f9fafb;font-weight:600;white-space:nowrap}
.reftable td.ra{font-weight:700;white-space:nowrap}
.reftable td:last-child{color:#4b5563;line-height:1.6}
.langbtns{display:flex;gap:4px}
.langbtns button{padding:6px 10px;font-size:12px;background:#4b5563;color:#d1d5db}
.langbtns button.on{background:#f59e0b;color:#1f2937}
.node-row.warn input{border-color:#ef4444;background:#fef2f2}
.seq{background:#eef2ff;color:#4f46e5;font-size:11px;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nname{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.node-row input[type=date]{width:126px;flex-shrink:0;font-size:12px;padding:4px 6px}
.node-row.off{opacity:.45}
.rec-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f3f4f6}
.rec-row.off{opacity:.45}
.rec-row .nname{flex:1;min-width:0}
.rmeta{display:block;font-size:11px;color:#9ca3af}
.offs{display:flex;align-items:center;gap:3px;font-size:11px;color:#9ca3af;flex-shrink:0}
.offs input{width:46px;font-size:12px;padding:3px 4px;border:1px solid #d1d5db;border-radius:6px}
.hint{font-size:12px;color:#9ca3af;margin:6px 0}
main{flex:1;overflow:auto;padding:12px 16px;min-width:0}
.legend{font-size:12px;color:#6b7280;margin-bottom:8px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:baseline}
.chart-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow-x:auto;min-height:320px;position:relative}
#emptyHint{padding:60px 20px;text-align:center;color:#9ca3af;font-size:14px;display:none}
svg text{font-size:11px;fill:#4b5563}
.axis{fill:#9ca3af;font-size:11px}
.mlabel{font-size:11px;fill:#1f2937}
.mdate{font-size:10px;fill:#9ca3af}
.glabel{font-size:12px;fill:#6b7280;font-weight:600}
.plabel{font-size:11px;fill:#1e40af}
.tlabel{font-size:11.5px;fill:#374151}
.task-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f3f4f6;font-size:12.5px}
.tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trange{color:#9ca3af;font-size:11px;white-space:nowrap}
.del{background:#fee2e2;color:#b91c1c;padding:4px 8px;font-size:12px}
.del:hover{background:#fecaca}
.task-form{margin-top:8px}
.task-form input{margin-bottom:6px}
.row2{display:flex;gap:6px}
.row2 input{flex:1;min-width:0}
#btnAddTask{width:100%}
.foot{font-size:11px;color:#9ca3af;margin-top:8px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:80%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  header .actions,aside,.foot,.legend{display:none}
  header{position:static}
  .main{display:block;height:auto}
  main{overflow:visible;padding:0}
  .chart-wrap{overflow:visible;border:none;min-height:0}
  svg{width:100%!important;height:auto!important}
}
.mobile-tabs{display:none;background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 12px;gap:8px}
.mobile-tabs button{flex:1;background:#eef2f7;color:#374151}
.mobile-tabs button.active{background:#f59e0b;color:#1f2937}
@media (max-width:768px){
  .mobile-tabs{display:flex}
  header{flex-wrap:wrap;row-gap:8px}
  .brand{font-size:14px}
  #projectName{flex:1 1 100%;width:auto}
  .actions{margin-left:0;flex:1 1 100%}
  .actions button{flex:1;padding:7px 4px;font-size:12px}
  .main{flex-direction:column;height:auto}
  body.tab-form main{display:none}
  body.tab-chart aside{display:none}
  aside{width:100%;border-right:none;overflow:visible}
  main{padding:8px}
  .legend{gap:8px;font-size:11px}
  .node-row input[type=date]{width:104px;font-size:11px;padding:4px}
  .nname{font-size:12px}
  .offs input{width:38px}
  .foot{font-size:10px}
}
</style>
</head>
<body class="tab-form">
<header>
  <div class="brand" data-i18n="brand">客户节点甘特图</div>
  <input id="projectName" type="text" data-i18n-ph="projectNamePh" placeholder="项目名称（例如：XX车型座椅项目）">
  <div class="actions">
    <div class="langbtns">
      <button data-lang="zh" class="on">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
    </div>
    <button id="btnSample" data-i18n="btnSample">载入示例日期</button>
    <button id="btnExport" class="ghost" data-i18n="btnExport">导出 JSON</button>
    <button id="btnImport" class="ghost" data-i18n="btnImport">导入 JSON</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
</header>
<div class="mobile-tabs">
  <button data-tab="form" class="active" data-i18n="tabForm">填写数据</button>
  <button data-tab="chart" data-i18n="tabChart">查看甘特图</button>
</div>
<div class="main">
  <aside>
    <section>
      <h3><span data-i18n="secOem">主机厂</span></h3>
      <select id="oemSelect"></select>
      <p class="hint" data-i18n="oemHint">切换主机厂后，客户节点清单自动更换；同名节点的日期会保留。</p>
    </section>
    <section>
      <h3><span data-i18n="secNodes">客户节点日期</span> <span id="nodeCount"></span></h3>
      <div id="nodeList"></div>
      <p class="hint" data-i18n="nodeHint">勾选参与本项目的节点，未勾选的不进入甘特图；日期倒置（后一节点早于前一节点）会标红提醒。</p>
    </section>
    <section>
      <h3><span data-i18n="secRec">推荐任务（模板）</span> <span id="recCount"></span></h3>
      <div id="recList"></div>
      <p class="hint" data-i18n="recHint">根据PAP节点对照表推荐的内部任务，日期按锚点节点自动推算；偏移周数可改；不勾选的不进入甘特图。</p>
    </section>
    <section>
      <h3><span data-i18n="secTasks">自定义任务</span></h3>
      <div id="taskList"></div>
      <div class="task-form">
        <input id="taskName" type="text" data-i18n-ph="taskNamePh" placeholder="任务名称（例如：模具T1试模）">
        <div class="row2">
          <input id="taskStart" type="date" data-i18n-al="startDate" aria-label="开始日期">
          <input id="taskEnd" type="date" data-i18n-al="endDate" aria-label="结束日期">
        </div>
        <button id="btnAddTask" data-i18n="btnAddTask">添加任务</button>
      </div>
    </section>
  </aside>
  <main>
    <div class="legend">
      <span><span class="dot" style="background:#f59e0b;transform:rotate(45deg)"></span><span data-i18n="legendMs">客户关键节点</span></span>
      <span><span class="dot" style="background:#bfdbfe;border:1px solid #60a5fa"></span><span data-i18n="legendPhase">阶段区间</span></span>
      <span><span class="dot" style="background:#60a5fa"></span><span data-i18n="legendRec">推荐任务</span></span>
      <span><span class="dot" style="background:#14b8a6"></span><span data-i18n="legendCustom">自定义任务</span></span>
      <span><span class="dot" style="background:#ef4444;width:2px;height:12px"></span><span data-i18n="today">今天</span></span>
      <span style="color:#ef4444" data-i18n="warnInvert">红色节点 = 日期倒置</span>
    </div>
    <div class="chart-wrap">
      <div id="chart"></div>
      <div id="emptyHint" data-i18n="emptyHint">请先选择主机厂，并在左侧填写各客户节点的日期，甘特图将自动生成。<br>也可以点「载入示例日期」先看效果。</div>
    </div>
    <section class="noderef">
      <h3 data-i18n="secNodeRef">客户节点说明</h3>
      <div id="nodeRef"></div>
    </section>
  </main>
</div>
<script>
const OEM_ORDER = ["BENZ(奔驰)", "Ford(福特)", "JAC(江淮)", "DYK(东风悦达起亚)", "Chery(奇瑞)", "SGMW(上汽通用五菱)", "Geely(吉利)", "BMW(宝马)", "SVW(上汽大众)", "SGM(上汽通用)", "Nissan(尼桑)", "CJLR(奇瑞捷豹路虎)", "DRAC(东风雷诺)", "DPCA(东风标致雪铁龙)", "CMA", "Volvo(沃尔沃)", "PSA"];
const OEM_NODES = {"BENZ(奔驰)":[["\"P\" Release","","DV 发放。设计&开发中的产品和过程问题已关闭，支持DV制造所需工装零件的长周期DV图纸已发放。","DV Release. Product and process issues have been closed of designation and development. The Tooling Parts long term DV Drawings have been released which will use to support DV build."],["\"_\" Release","","PV发放。设计验证中的产品和过程问题已关闭，且长周期PV图纸已发放。有合适的计划支持PV制造、PV测试和客户需求。","PV Release. Product and process issues have been closed of verification of design. Long term drawings of PV have been released. Program should have suitable plan to supprot PV build, PV test and custo"],["Engineering Sample","","工程样件。提交符合客户要求的工程样件。","Suppliers should submit engineering samples which are meet the customer's requirements."],["OTS（Off Tooling Samples）","","工装样件认可。供应商在全工装状态下非节拍生产条件下制造出来的样件得到客户认可。主要验证产品的设计能力、以及公司工装生产的产品是否满足产品的使用 要求。","Samples should be approved by customer which are submitted by supplier which are be producted in statement of full tooling and off-beat production."],["Lot（BL","","Baulos）:整车试制。交产品前完成Critical试验。","Baulos）:  The vehicle manufacturing. Supplier should complete all critical tests before submit products to customer."],["ET","","Engineering Trial 工程试制。供应商在此阶段提交的产品均需要采用正规的工装模具来生产，一般包装也要求为正规包装。","Engineering Trial . Products which are submitted by supplier to customer should be producted by regular toolings, and general packaging also for the regular packaging."],["PT","","Production Trial 生产线第一轮试生产。供应商此阶段提交的产品应使用正规化的工艺路线和要求进行生产。主要验证能否满足量产要求。客户要求可以上市的市场车，需要完成所有的PV和DBL试验的要求。如果有失效，需要客户进行认可。","Production Trial. Products which are submitted by supplier to customer should be prodcted by regular process route and requirements. The main verfication can meet the requirements of mass production. "],["PPAP Submition （Production Part Approval Process Submit)","","PPAP初版提交，要求供应商产品质量符合客户要求。","The product quality of supplier should meet the customer requirements."],["PPAP-Yellow（Production Part Approval Process Yellow)","","生产件批准程序1。 PPAP为黄色， 需要完成DBL的要求。","PPAP approval risk is Yellow and complete all DBL requirements."],["PPAP-Green（Production Part Approval Process Green)","","生产件批准程序2。PPAP批准为绿色， 所有的试验OK。","PPAP approval risk is green and all test should be passed."],["SOP","","Start of Production 投产，批量生产开始。","Start of Production."]],"Ford(福特)":[["FDJ（Final Data Judgment）","","最终数据判定。OEM签署开发模具申请、工装&检具方案评审。供应商需提供工装、检具、设备的开发计划，完成工装、检具方案，并提交开模申请。","The development request of tooling , equipment and fixture should be signed off by OEM. Supplier should deliverate the plan of tooling, equipment and fixture. And supplier should complete the proposal"],["VP（Verification Prototype）","","样车验证。供应商需完成样件模具/工装检具开发，完成样件控制计划，并开始生产和交付OTS样件，DV的关键实验要完毕。","Supplier should complete the development of tooling and fixture plan, and should ignitiate product and submit OTS samples.S upplier should complete the critical test of DV."],["PEC（Preliminary Engineering Completion）","","初始工程签发。供应商内外部质量问题需解决完毕、DV试验完成、需重新进行DV验证的计划确认完成。","Supplier should complete all the DV test and solved all the quality problem. Supplier should complete the plan of the DV verification if the test need to redo."],["FEC（Final Engineering Completion）","","最终工程签发。供应商需完成需要重新进行的DV试验。","Supplier should complete all the DV test which need to redo."],["HB（homologation build）","","法规车装车。需要供应商完成PV全部实验（视情况而定，关键试验完成的情况下也可以通过，但是需要和客户协商）。","Supplier should complete all the PV test. Supplier can also complete all the critical test of PV  if supplier get customer approved."],["LR（Launch Readiness）","","投产准备。供应商装配&制造所用的工装与设备（量产的）准备就绪，客户会到供应商处评审。","Supplier should prepared all production tooling and equipment which can be used to assembly and build. Customer will visit supplier and review status."],["TT（Tooling Trial-Build start）","","工装试运行。要求供应商产能（不包括节拍）、工装、制造过程全部符合要求。","Power of production ，tooling, build process should meet the request above all of the supplier."],["PP （Pilot Production）","","小批量生产。供应商需支持PP装车零件交付，达到正规生产的全部要求。","Supplier need to submit the parts which are supportting PP build. Parts need meet all the requirements of production."],["PPAP1","","初版PPAP提交，要求供应商产品质量符合主机厂的全部质量要求。","Supplier should submit pre-PPAP and parts quailities should meet all requirements."],["PPAP2","","生产验证，要求供应商的生产线设备、工装、防错等符合客户的生产要求。","Production verification. Supplier's equipment of production, tooling and mistake proofing should meet all the customer's production requiements."],["PPAP3","","生产能力验证，要求供应商产能达到客户量产要求。","Power of production verifiction. Supplier should meet all the customer's requirements of production."],["MP/job1（Master Production）","","量产。","Production."]],"JAC(江淮)":[["G1","","产品规划。商品企划依据立项预研阶段需求及可行性分析，完成产品定义，批准立项，下发开发指令；","Product planning. Product planning based on demand and feasibility analysis set up in project preparatory stage, complete product definition, approval the project and issue development order;"],["G2","","产品策划。组织开展产品策划工作，明确产品开发具体可操作性的目标；组织开展项目管理策划工作，进行基于目标实现的过程策划，明确开发的流程.结构.过程和方法；","Product scheme. Organize product scheme activities, clarify product development achievable goals ; Organize project management planning activitites: clarify development process, structure and mothed a"],["G3-G5","","造型开发。基于已定的概念目标以及实现过程，开展各项目的详细目标设计，由基本概念导入具有可度量.可视化的信息，将产品策划转化为项目的方案设计。","Styling development. Carry out detialed project design based on defined concept and plan, from fundemental concept expand to measurable and visualable information, convert product scheme into project "],["G6","","设计开发。将产品设计数据经过审核，分析，最终数模确认发布，启动各零部件批量模具指定及样件生产工作。","Design and development. Product design data final released through review, analysis, and confirmation,  kick off all components/parts production/tooling normination."],["G7-G8","","设计验证。基于最终数据及工艺文件开展零部件快速成型验证，整车验证等，在工装设备进场安装调试前完成设计确认；","Design verification. Apply components' verification and vehicle level validation based on final data and process documents. Complete design verfication before equipment/tooling installation."],["G9-G12","","量产准备。基于前期设计验证的结果开展工装调试以及整车开发目标的逐步实现过程，完成进入量产评价阶段的准备。","SOP preparation. Complete SOP readiness prereparation, apply tooling adjustment with vehicle level development progress realization based on design validation result."],["G13","","量产评价。基于量产评价阶段市场销售信息以及项目开发目标的市场验证结果，开展项目量产评价验收以及最终的项目总结，项目关闭。","SOP evaluation. Apply project mass production evaluation and final project summary, complete project closure, based on marketing sales and project development goal achievement from market feedback."]],"DYK(东风悦达起亚)":[["Model Fix","","座椅造型面锁定；","Styling freeze"],["PROTO","","座椅完成DV 关键实验，交付客户进行DV 装车验证","Finish critical DV test. Seat delivered for DV vehichle build and validation."],["M-CAR","","DV设计锁定，DV验证完成。交付客户DV最终状态样件进行装车评审。座椅开始启动PV 模具。","DV design and validation freeze.Deliver the final DV seat to cusomer for vehichle build and review."],["P1","","完成PV关键性PV实验，交付客户进行PV装车及验证。","Finish critical PV test. Seat delivered for PV vehichle build and validation."],["T","","座椅完成所有PV实验，交付客户进行在线装车及设备调试","Finish all PV test. Seat delivered to customer fo ron-line vehichle build and euipment  try-out."],["P2","","座椅完成皮纹及所有PV实验，交付客户进行在线装车验证","All pv test have been done，seats with grain parts delivered to customer for on-line vehicle build."],["M","","爬坡验证可以达到节拍生产","Vehicle build on-line at rate."],["SOP","","量产","Start of production"]],"Chery(奇瑞)":[["P0","","市场策略分析，整车架构布点等。","Market strategy analysis, vehicle architecture layout, etc."],["P1","","预研指令；预研预算批准；效果图启动指令；效果图冻结；产品定义报告；关键件供应商决裁完成。","Pre-research order; Approval of the pre-research budget; Sketch start order; Sketch frozen; Product definition report; Critical parts supplier determination completed."],["P2","","效果图冻结；立项指令；A面冻结；M1数据冻结，M1数据可支持模具涉及启动；100%供应商决裁完成。","Sketches Frozen: Project approval; Frozen A-surface; M1 data frozen, M1 data can support tooling kick off; 100% supplier determination completed."],["P3","","A面冻结；固定投资批准；M2数据冻结，硬模工艺设计确认，M2数据支持软模/硬模投注开始。","A-surface Frozen; Approval of Capital investment; M2 data frozen,  hard tooling process design confirmed, M2 data which support soft/hard tool bidding start."],["P4","","结构验证完成；外协件检具验收，1st 整车工艺验证完成；","Structure verification completed; 1st vehicle process verification completed. Outsource gage validated."],["OTS","","外观/内饰匹配、PQ验收；整车性能实验验收；模具预验收&回厂；供应商工艺/工序验证；供应商PVS产能验证完；整车工艺验证确认。","Appearance/interior matching, PQ acceptance;Vehicle performance test; Tooling pre-acceptance & ship to plant; Supplier process verfication; The supplier's PVS capacity verification completed; Vehicle "],["PVS","","装车阶段，试生产。","Vehicle pre-production."],["2TP","","达产审核，要求供应商产品质量符合主机厂的全部质量要求。","Audit to ensure supplier meet all OEM quality requirements."],["0S","","生产验证，要求供应商的生产线设备、工装、防错等符合客户的生产要求。","Production verification, the supplier's production line equipment, tooling, error-proofing need to meet the customer's production requirements."],["PPAP","","生产能力验证，要求供应商产能达到客户量产要求。","Verify the production capacity and the supplier need to meet the customer's mass production requirements."],["SOP","","量产。","Start of production"]],"SGMW(上汽通用五菱)":[["DSI","","Document of Strategic Intent  立项建议书 Project proposal",""],["VPI","","Vehicle Program Initiation  整车项目启动Vehicle Project Kick Off",""],["LLP T1","","Long Lead Process T1  长周期T1数据(3D)锁定 Long-lead  T1 data (3D) frozen",""],["LLP T2","","Long Lead Process T1  长周期T2数据(3DA及图纸）锁定Long-lead  T2 data (3D) frozen",""],["OTS","","Off Tooling Sample   工装样件Off Tooling Sample",""],["NS","","Non-Salable   在正式生产系统制造出的不可销售样车Non - saleable vehicle manufactured in the production line",""],["S","","Salable  在正式生产系统制造出的可销售样车Saleable vehicle manufactured in the production line",""],["SOP","","Start Of Pilot  量产Start Of Pilot",""]],"Geely(吉利)":[["PSF(Program Strategy)","","签发项目策略，首次明确产品定义；签发策略性问题的解决方案","Signing project strategies, and clarifying product definitions for the first time; signing solutions to strategic issues."],["PS(Program Start)","","签发绿，红，蓝皮书中定义的项目商务/工程/市场方面的假设；决定项目先决条件，包括车型项目计划，造型时间计划，造型二选一，采购计划，质量目标，系统共同和沿用化方案；签发项目至<PC>所需的预算，包括在<PC>前所需长周期投资","Signing business, engineering, and marketing assumptions as aunch activities to continue; confirm market confi"],["TT(Tooling Trail)","","确保TT造车符合OktB需求；确认TT造车的工艺能力；确认工人培训计划","Ensure that TT manufacturing meets OktB requirements; confirm TT manufacturing process capability; confirm worker training plan."],["LS(Launch Sign-Off)","","签发进入PP阶段；批准市场投放活动继续开展","Issuance enters the PP stage; market launch activities are approved to continue."],["PP(Poilt Production)","","确保PP造车达到OktB目标；确认PP造车的工艺能力；确认工人培训计划","Ensure PP manufacturing meets OktB goal; confirm PP manufacturing process capability; confirm worker training plan."],["J1(Job 1)","","签发开始批量生产;签发市场投放计划，准备启动销售","Issue and start mass production; issue market launch plan, ready to start sales."],["OKTB(OK-to-Buy)","","确认可销售量产阶段所造车辆；确认政府认证完成且公告已经发布；确认正在执行的生产爬坡计划","Confirm the sale of vehicles manufactured in the mass production stage; confirm that the government certification is completed and the announcement has been issued; confirm the ongoing production ramp"],["FSR(Final Status Report)","","项目关闭；确认所有工作已经完成或成功移交；总结经验教训","The program is closed; confirm that all work has been completed or successfully handed over; sum up lessons learned."]],"BMW(宝马)":[["BBG（Pilot phase/Bestätigungsbaugruppe）","","设计验证阶段。样件要求为软模或量产模具件，供应商内部的关键实验需完成。","Design verfication.Samples should be made by soft mold or mass production mold,and all internal critical tests should be completed."],["Auflegetage","","PV发放。设计验证中的产品和过程问题已关闭，且长周期PV图纸已发放。有合适的计划支持PV制造、PV测试和客户需求。","PV Release.All product and process issues which were happened on DV should be closed.Supplier should released all long term drawings.Supplier should give customer plan that is used to support PV Build"],["PVL/VS0（Process pre runners/Prozessvorläufer）","","预生产阶段，一般在VS2之前完成生产发放。样件要求为在模具制造商或供应商量产工厂生产的量产模具件，供应商的内部关键实验需完成。","Pre-production.Samples should be producted by supplier in mass production area or toolings supplier."],["VS1、VS2（Pre series/Vorserie）","","产品认证阶段。VS1样件要求为在供应商量产工厂并使用量产工艺流程生产的量产模具件，VS2样件在此要求上增加皮纹要求，供应商的全部实验需完成。","Production v   if(!s) return null;

  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d.getTime()) ? null : d;
}

  function p(n){ return String(n).padStart(2,'0'); }

}

}

/* ---------- 甘特图 ---------- */
function renderChart(){

    s += '<g><title>' + esc(label + (m.desc ? '\n' + m.desc : '') + '\n' + fmtD(m.d)) + '</title>'

    var y = TK_Y + i * TK_H + (TK_H - 18)/2;
    var x1 = X(t.s), x2 = X(t.e);
    s += '<g><title>' + esc(t.name + '\n' + fmtD(t.s) + ' ~ ' + fmtD(t.e)) + '</title>'
      + '<rect x="' + x1.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + Math.max(x2-x1, 3).toFixed(1) + '" height="18" rx="4" fill="' + (t.rec ? '#60a5fa' : '#14b8a6') + '"/>'
      + '</g>';
  });
  // 今天线
  var today = new Date(); today.setHours(0,0,0,0);
  if(today >= min && today <= max){
    var tx = X(today);
    s += '<line x1="' + tx.toFixed(1) + '" y1="24" x2="' + tx.toFixed(1) + '" y2="' + H + '" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>'
      + '<text x="' + (tx+4).toFixed(1) + '" y="20" fill="#ef4444" font-size="11">' + esc(tr('today')) + '</text>';
  }

  chart.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' + s + '</svg>';
}

/* ---------- 右侧：客户节点说明表（甘特图下方） ---------- */
function renderNodeRef(){
  var el = $('nodeRef');
  var ns = nodes();
  if(!ns.length){ el.innerHTML = ''; return; }
  var html = '<table class="reftable"><thead><tr><th>' + tr('refAbbr') + '</th><th>' + tr('refName') + '</th><th>' + tr('refDesc') + '</th></tr></thead><tbody>';
  ns.forEach(function(n){
    html += '<tr><td class="ra">' + esc(abbr(n[0])) + '</td><td>' + esc(n[0]) + '</td><td>' + esc(nodeDesc(n)) + '</td></tr>';
  });
  el.innerHTML = html + '</tbody></table>';
}

function renderAll(){ renderNodes(); renderRecTasks(); renderTasks(); renderChart(); renderNodeRef(); }

/* ---------- 移动端标签页 ---------- */
function setTab(which){
  document.body.classList.toggle('tab-chart', which === 'chart');
  document.body.classList.toggle('tab-form', which !== 'chart');
  var btns = document.querySelectorAll('.mobile-tabs button');
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('active', btns[i].dataset.tab === which);
  }
  if(which === 'chart') renderChart();
}

/* ---------- 操作 ---------- */
function sampleDates(){
  var ns = nodes();
  if(!ns.length) return;
  var today = new Date(); today.setHours(0,0,0,0);
  var start = addDays(today, -540), end = addDays(today, 180);
  var span = diffDays(start, end), n = ns.length;
  ns.forEach(function(nd, i){
    state.dates[nd[0]] = fmtD(addDays(start, Math.round(span * i / Math.max(n-1, 1))));
  });
  save(); renderAll();
  if(window.innerWidth <= 768) setTab('chart');
}

function init(){
  var sel = $('oemSelect');
  load();
  if(!OEM_NODES[state.oem]) state.oem = 'SVW(上汽大众)';
  buildOemOptions();
  $('projectName').value = state.projectName || '';

  sel.addEventListener('change', function(){
    state.oem = sel.value;
    var names = {};
    nodes().forEach(function(n){ names[n[0]] = true; });
    Object.keys(state.dates).forEach(function(k){ if(!names[k]) delete state.dates[k]; });
    Object.keys(state.excluded).forEach(function(k){ if(!names[k]) delete state.excluded[k]; });
    save(); renderAll();
  });
  $('projectName').addEventListener('input', function(){
    state.projectName = this.value; save();
  });
  var langBtns = document.querySelectorAll('.langbtns button');
  for(var li = 0; li < langBtns.length; li++){
    langBtns[li].addEventListener('click', function(){ lang = this.getAttribute('data-lang'); applyLang(); });
  }
  var tabBtns = document.querySelectorAll('.mobile-tabs button');
  for(var ti = 0; ti < tabBtns.length; ti++){
    tabBtns[ti].addEventListener('click', function(){ setTab(this.dataset.tab); });
  }
  $('btnSample').addEventListener('click', sampleDates);
  $('btnExport').addEventListener('click', function(){
    var data = JSON.stringify({ app:'gantt-v1', version:1, savedAt:new Date().toISOString(), state:state }, null, 2);
    var blob = new Blob([data], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gantt-' + fmtD(new Date()).replace(/-/g,'') + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  $('btnImport').addEventListener('click', function(){ $('fileImport').click(); });
  $('fileImport').addEventListener('change', function(){
    var f = this.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var obj = JSON.parse(rd.result);
        var st = obj.state || obj;
        if(!st || typeof st !== 'object' || !OEM_NODES[st.oem]) throw new Error('bad');
        state.oem = st.oem;
        state.projectName = typeof st.projectName === 'string' ? st.projectName : '';
        state.dates = (st.dates && typeof st.dates === 'object') ? st.dates : {};
        state.excluded = (st.excluded && typeof st.excluded === 'object') ? st.excluded : {};
        state.recTasks = (st.recTasks && typeof st.recTasks === 'object') ? st.recTasks : {};
        state.tasks = Array.isArray(st.tasks) ? st.tasks.filter(function(t){ return t && typeof t.name === 'string'; }) : [];
        sel.value = state.oem;
        $('projectName').value = state.projectName;
        save(); renderAll();
      }catch(e){ toast(tr('toastImportFail')); }
    };
    rd.readAsText(f);
    this.value = '';
  });
  $('btnAddTask').addEventListener('click', function(){
    var name = $('taskName').value.trim();
    var s = $('taskStart').value, e = $('taskEnd').value;
    if(!name){ toast(tr('toastNeedName')); return; }
    var ds = parseD(s), de = parseD(e);
    if(!ds || !de){ toast(tr('toastNeedDates')); return; }
    if(de < ds){ toast(tr('toastEndBeforeStart')); return; }
    state.tasks.push({ name:name, start:s, end:e });
    $('taskName').value = ''; $('taskStart').value = ''; $('taskEnd').value = '';
    save(); renderAll();
  });

  var rsz;
  window.addEventListener('resize', function(){
    clearTimeout(rsz);
    rsz = setTimeout(renderChart, 150);
  });

  applyLang();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
</script>
</body>
</html>
