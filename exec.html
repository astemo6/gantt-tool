<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>执行层计划 · Execution Plan</title>
<style>
:root{
  --steel:#1e3a52; --steel2:#2b4d6a; --steel3:#3a6283; --accent:#2563eb;
  --tx1:#1f2937; --tx2:#4b5563; --tx3:#6b7280;
  --bg:#eef1f5; --side:#f8fafc; --card:#fff; --line:#d9dee5; --line2:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx1);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--steel);color:#fff;height:48px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
header h1{font-size:15px;font-weight:600}
header .sub{font-size:11px;opacity:.7}
header .sp{flex:1}
header button{background:var(--steel2);border:1px solid #4b6a85;color:#fff;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
header button:hover{background:var(--steel3)}
.langbtns{display:flex;gap:4px}
.langbtns button{padding:4px 8px;font-size:11px}
.langbtns button.on{background:var(--accent);border-color:var(--accent)}
.toolbar{background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.toolbar button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--tx1)}
.toolbar button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar button.primary:hover{background:#1d4ed8}
.toolbar .sep{width:1px;height:20px;background:var(--line)}
.viewbtns{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.viewbtns button{border:none;border-radius:0;padding:6px 14px}
.viewbtns button.on{background:var(--steel2);color:#fff}
.main{flex:1;display:flex;min-height:0}
.table-pane{width:460px;min-width:340px;max-width:640px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.table-head{display:flex;background:var(--steel);color:#fff;font-size:11px;font-weight:600;flex-shrink:0}
.table-head>div{padding:8px 6px;border-right:1px solid #4b6a85;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.table-body{flex:1;overflow:auto}
.trow{display:flex;border-bottom:1px solid var(--line2);cursor:pointer;align-items:stretch}
.trow:hover{background:#eef4ff}
.trow.sel{background:#dbeafe}
.trow>div{padding:7px 6px;border-right:1px solid var(--line2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;display:flex;align-items:center}
.trow.group{background:#e8eef5;font-weight:600}
.trow.group>div{font-size:12px}
.trow .c-id{width:36px;justify-content:center;color:var(--tx3);flex-shrink:0}
.trow .c-name{flex:1;min-width:0}
.trow .c-owner{width:64px;flex-shrink:0}
.trow .c-dur{width:52px;justify-content:center;flex-shrink:0}
.trow .c-prog{width:56px;justify-content:center;flex-shrink:0}
.trow .c-start{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.trow .c-end{width:86px;justify-content:center;flex-shrink:0;color:var(--tx2)}
.table-head .c-id{width:36px;text-align:center;flex-shrink:0}
.table-head .c-name{flex:1}
.table-head .c-owner{width:64px;flex-shrink:0}
.table-head .c-dur{width:52px;text-align:center;flex-shrink:0}
.table-head .c-prog{width:56px;text-align:center;flex-shrink:0}
.table-head .c-start{width:86px;text-align:center;flex-shrink:0}
.table-head .c-end{width:86px;text-align:center;flex-shrink:0}
.progbar{width:44px;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.progbar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ms-diamond{color:var(--danger);font-size:14px}
.gantt-pane{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.gantt-head{height:44px;background:var(--card);border-bottom:1px solid var(--line);position:relative;overflow:hidden;flex-shrink:0}
.gantt-body{flex:1;overflow:auto;position:relative}
.gantt-inner{position:relative;min-height:100%}
.g-row{position:relative;border-bottom:1px solid var(--line2)}
.g-row.group{background:#e8eef555}
.g-bar{position:absolute;height:20px;top:7px;border-radius:4px;cursor:grab;display:flex;align-items:center;overflow:hidden;font-size:11px;color:#fff;white-space:nowrap}
.g-bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.35);border-radius:4px 0 0 4px}
.g-bar .lbl{position:relative;padding:0 8px;z-index:1}
.g-ms{position:absolute;top:9px;width:16px;height:16px;transform:rotate(45deg);cursor:grab;border-radius:2px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:5}
.g-weekend{position:absolute;top:0;bottom:0;background:#f3f4f6;z-index:0}
.g-holiday{position:absolute;top:0;bottom:0;background:#fef2f2;z-index:0}
.g-dep{position:absolute;z-index:4;pointer-events:none}
.day-cell{position:absolute;top:0;bottom:0;border-right:1px dashed #e5e7eb}
.gh-day{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.gh-date{font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;line-height:1.25}
.gh-wd{font-size:8px;color:var(--tx3);white-space:nowrap;line-height:1.25}
.gh-wk{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden}
.g-bandrow{position:absolute;left:0;top:0;border-bottom:1px solid var(--line);background:var(--card)}
.g-band{position:absolute;top:0;height:100%;display:flex;align-items:center;overflow:hidden;font-size:10px;color:#1e3a52;border-right:1px solid rgba(255,255,255,.8);white-space:nowrap}
.g-band span{padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{background:var(--steel);color:#fff;padding:12px 16px;font-size:14px;font-weight:600;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-h button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.modal-b{padding:16px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px 10px;font-size:13px}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #93c5fd55}
.frow2{display:flex;gap:12px}
.frow2>div{flex:1}
.modal-f{padding:12px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}
.modal-f button{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.modal-f .ok{background:var(--accent);border-color:var(--accent);color:#fff}
.cal-panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 16px}
.cal-panel h3{font-size:13px;margin-bottom:8px}
.cal-panel textarea{width:100%;height:64px;border:1px solid #cbd5e1;border-radius:6px;padding:8px;font-size:12px;resize:vertical}
.cal-panel .row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cal-panel button{background:var(--steel2);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer}
.cal-panel button.on{background:var(--accent)}
.cal-panel .hint{font-size:11px;color:var(--tx3);margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;display:none}
#pvModal{position:fixed;inset:0;background:rgba(17,24,39,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#pvModal.open{display:flex}
.pv-box{background:#fff;border-radius:10px;padding:12px 14px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:600;font-size:14px;color:#1f2937}
.pv-x{background:#e5e7eb;color:#1f2937;border:none;border-radius:6px;width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer;padding:0;flex-shrink:0}
.pv-x:hover{background:#d1d5db}
#pvImg{display:block;max-width:calc(90vw - 32px);max-height:calc(85vh - 62px);border:1px solid #e5e7eb;border-radius:6px}
.dep-line{stroke:#94a3b8;stroke-width:1.5;fill:none}
@media(max-width:768px){.table-pane{width:300px;min-width:260px}}
/* ===== 手机端补充适配（仅小屏生效，不改桌面端布局与配色；不动 viewport，不拦截浏览器原生缩放） ===== */
@media (max-width:768px){
  /* 顶栏标题缩小 */
  header{height:auto;min-height:48px;flex-wrap:wrap;padding:6px 10px;row-gap:6px}
  header h1{font-size:13px}
  header .sub{display:none}
  /* 工具条按钮允许换行不溢出，触摸目标不小于 40px */
  .toolbar{padding:6px 10px;gap:6px}
  header button,.toolbar button,.viewbtns button,.modal-f button,.cal-panel button{min-height:40px;min-width:40px}
  .frow input,.frow select,.frow textarea{min-height:40px}
  /* 左侧任务表允许横向滚动（列宽不压缩），甘特区横向滚动 */
  .table-pane{width:42%;min-width:0;max-width:none;overflow-x:auto}
  .table-head,.table-body{min-width:520px}
  .gantt-pane{min-width:0}
  /* 表格字号适当缩小 */
  .table-head{font-size:10px}
  .trow>div{font-size:11px;padding:6px 4px}
  .gh-date{font-size:8px}
  .gh-wd{font-size:7px}
  .toast{max-width:90vw}
}
</style>
</head>
<body>
<header>
  <h1 data-i18n="appTitle">执行层计划</h1><span class="sub">Execution Plan</span>
  <span class="sp"></span>
  <div class="langbtns">
    <button data-lang="zh">中文</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
  </div>
  <button id="btnBack" data-i18n="backToPlan">← 里程碑计划</button>
</header>
<div class="toolbar">
  <button id="btnAdd" class="primary" data-i18n="addTask">+ 新增任务</button>
  <button id="btnAddGroup" data-i18n="addGroup">+ 新增分组</button>
  <button id="btnAddMs" data-i18n="addMs">+ 里程碑</button>
  <span class="sep"></span>
  <button id="btnFromPlan" data-i18n="fromPlan">从计划导入</button>
  <button id="btnSyncBack" data-i18n="syncBack">回写里程碑计划</button>
  <button id="btnImportSub" data-i18n="importSub">导入细项</button>
  <span class="sep"></span>
  <div class="viewbtns">
    <button data-view="day" class="on" data-i18n="vDay">日</button><button data-view="week" data-i18n="vWeek">周</button><button data-view="month" data-i18n="vMonth">月</button>
  </div>
  <span class="sep"></span>
  <button id="btnCal" data-i18n="workCal">工作日历</button>
  <span class="sep"></span>
  <button id="btnPDF" data-i18n="exportPDF">导出 PDF</button>
  <button id="btnJPG" data-i18n="exportJPG">导出 JPG</button>
  <button id="btnPreview" data-i18n="preview">预览</button>
  <span class="sep"></span>
  <button id="btnExport" data-i18n="exportJSON">导出JSON</button>
  <button id="btnImport" data-i18n="importJSON">导入JSON</button>
  <input type="file" id="fileJSON" accept=".json" style="display:none">
  <button id="btnCSV" data-i18n="exportCSV">导出CSV</button>
</div>
<div class="cal-panel" id="calPanel" style="display:none">
  <h3 data-i18n="calTitle">工作日历 · 自然语言导入</h3>
  <div class="row" style="margin-bottom:6px">
    <button id="calModeNL" data-i18n="calModeNL">自然语言</button>
    <button id="calModeText" data-i18n="calModeText">文本格式</button>
  </div>
  <textarea id="calInput" data-i18n-ph="calPh" placeholder="例如：2026年春节2月15日到2月23日放假，2月14日、2月28日调休上班"></textarea>
  <div class="row">
    <button id="btnCalParse" data-i18n="calParse">解析并导入</button>
    <button id="btnCalReset" data-i18n="calReset">恢复默认</button>
    <span class="hint" id="calSummary"></span>
  </div>
  <div class="hint" data-i18n="calHint">支持：X月X日、X月X日至X月X日、放假/调休/补班/上班等关键词，年份缺省为当年。解析结果会列出，请确认后再应用。</div>
  <div id="calPreview" style="margin-top:8px;font-size:12px"></div>
</div>
<div class="main">
  <div class="table-pane">
    <div class="table-head">
      <div class="c-id">ID</div><div class="c-name" data-i18n="cName">任务名称</div><div class="c-owner" data-i18n="cOwner">负责人</div><div class="c-dur" data-i18n="cDur">工期</div><div class="c-prog" data-i18n="cProg">进度</div><div class="c-start" data-i18n="cStart">开始</div><div class="c-end" data-i18n="cEnd">结束</div>
    </div>
    <div class="table-body" id="taskList"></div>
  </div>
  <div class="gantt-pane">
    <div class="gantt-head" id="ganttHead"></div>
    <div class="gantt-body" id="ganttBody"><div class="gantt-inner" id="ganttInner"></div></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-h"><span id="modalTitle">编辑任务</span><button id="modalX">×</button></div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f">
      <button id="modalDel" style="margin-right:auto;color:var(--danger);display:none" data-i18n="del">删除</button>
      <button id="modalCancel" data-i18n="cancel">取消</button>
      <button id="modalOk" class="ok" data-i18n="ok">确定</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="subModalBg">
  <div class="modal">
    <div class="modal-h"><span data-i18n="importSubT">导入细项</span><button id="subX">×</button></div>
    <div class="modal-b">
      <div class="frow"><label data-i18n="subTarget">目标任务</label><select id="subTask"></select></div>
      <div class="frow"><label data-i18n="subContent">细项内容（一行一条，可含负责人、工期，用逗号分隔，如：高温测试,张三,5）</label>
      <textarea id="subText" rows="8" placeholder="高温测试,张三,5&#10;振动测试,李四,3&#10;盐雾测试"></textarea></div>
      <div class="frow"><label data-i18n="subFile">或从 CSV 文件导入</label><input type="file" id="subFile" accept=".csv,.txt"></div>
    </div>
    <div class="modal-f">
      <button id="subCancel" data-i18n="cancel">取消</button>
      <button id="subOk" class="ok" data-i18n="ok">确定</button>
    </div>
  </div>
</div>
<div id="pvModal" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
  <div class="pv-box">
    <div class="pv-head">
      <span id="pvTitle" data-i18n="expPreviewTitle">导出预览</span>
      <button id="pvClose" class="pv-x" aria-label="Close">×</button>
    </div>
    <img id="pvImg" alt="Export preview">
  </div>
</div>
<div class="toast" id="toast"></div>

/* ============ 排期引擎 ============ */
function taskEnd(t){ // 按工期算结束日（含开始日）
  if(t.type === "milestone") return t.start;
  if(t.dur <= 0) return t.start;
  var d = parseD(t.start); if(!d) return t.start;
  return fmtD(addWorkdays(d, t.dur - 1));

function topoSort(tasks){ // 前置拓扑排序，返回 {order, cyclic}
  var byId = {}, indeg = {}, adj = {};
  tasks.forEach(function(t){ byId[t.id] = t; indeg[t.id] = 0; adj[t.id] = []; });
  tasks.forEach(function(t){
    (t.deps||[]).forEach(function(pid){
      if(byId[pid] && pid !== t.id){ adj[pid].push(t.id); indeg[t.id]++; }
    });
  });
  var q = tasks.filter(function(t){ return indeg[t.id] === 0; }).map(function(t){ return t.id; });
  var order = [], cyclic = [];
  while(q.length){ var id = q.shift(); order.push(id); adj[id].forEach(function(n){ if(--indeg[n] === 0) q.push(n); }); }

  r.order.forEach(function(id){
    var t = byId[id]; if(!t || t.type === "milestone") return;

/* 自然语言解析：中文日期表达 → 节假日/调休 */
function parseCalNL(text){
  var year = new Date().getFullYear();
  var ym = text.match(/(\d{4})\s*年/); if(ym) year = +ym[1];
  var holidays = {}, makeup = [];
  function dstr(m, d){ return year + "-" + (m<10?"0":"")+m + "-" + (d<10?"0":"")+d; }
  // 区间：X月X日到/至X月X日 / X月X日-X月X日
  var re = /(\d{1,2})月(\d{1,2})[日号]?\s*(?:到|至|-|~)\s*(\d{1,2})月(\d{1,2})[日号]?/g, m;
  var ranges = [];
  while((m = re.exec(text))){
    var a = new Date(year, +m[1]-1, +m[2]), b = new Date(year, +m[3]-1, +m[4]);
    if(b < a) b = new Date(year+1, +m[3]-1, +m[4]);
    ranges.push([a, b, m.index]);
  }
  // 同月区间：X月X日到X日
  var re2 = /(\d{1,2})月(\d{1,2})[日号]?\s*(?:到|至)\s*(\d{1,2})[日号]/g;
  while((m = re2.exec(text))){
    if(ranges.some(function(r){ return Math.abs(r[2]-m.index) < 4; })) continue;
    ranges.push([new Date(year, +m[1]-1, +m[2]), new Date(year, +m[1]-1, +m[3]), m.index]);
  }
  // 单日：X月X日（排除已在区间内的）
  var re3 = /(\d{1,2})月(\d{1,2})[日号]/g, singles = [];
  while((m = re3.exec(text))){
    var d = new Date(year, +m[1]-1, +m[2]);
    if(ranges.some(function(r){ return d >= r[0] && d <= r[1]; })) continue;
    singles.push([d, m.index]);
  }
  // 判断每个日期片段是放假还是调休：看附近关键词
  function kindAt(idx){
    var ctx = text.slice(Math.max(0, idx-12), idx+16);
    if(/调休|补班|上班/.test(ctx)) return "makeup";
    return "holiday";
  }
  ranges.forEach(function(r){
    var k = kindAt(r[2]);
    var d = new Date(r[0]);
    while(d <= r[1]){ if(k === "makeup") makeup.push(fmtD(d)); else holidays[fmtD(d)] = 1; d = addDays(d, 1); }
  });
  singles.forEach(function(s){
    if(kindAt(s[1]) === "makeup") makeup.push(fmtD(s[0])); else holidays[fmtD(s[0])] = 1;
  });
  return { holidays:holidays, makeup:makeup };
}

/* 阶段色带锚点：按 OEM 标准阶段体系（ML0-7/APQP1-5/ANPQP1-5）解析锚点客户里程碑日期。
   无日期的阶段跳过；按日期排序。BMW 等 OEM 的非标准阶段键（VS0/VS2/PrePZS/PZS）不参与。 */
function phaseAnchors(){
  if(!state.planOem) return [];
  var sys = (typeof OEM_PHASE_SYS !== "undefined" && OEM_PHASE_SYS[state.planOem]) || "";
  var names = (typeof PHASE_NAMES !== "undefined" && PHASE_NAMES[sys]) || null;
  if(!names) return [];
  var phases = (typeof OEM_PHASES !== "undefined" && OEM_PHASES[state.planOem]) || {};
  var ms = state.tasks.filter(function(t){ return t.type === "milestone" && String(t.source || "").indexOf("ms:") === 0; });
  var out = [];
  Object.keys(names).forEach(function(pid){
    var an = phases[pid]; if(!an) return;
    var hit = null;
    ms.forEach(function(t){ if(!hit && planResolveAnchor(an, [t.name])) hit = t; });
    if(!hit || !hit.start) return;

function renderGantt(){

  // 月视图每列一个月，列宽按当月实际天数（30天月=PX_MONTH），与 X() 按天映射对齐

    var moCur = new Date(min.getFullYear(), min.getMonth(), 1), moI = 0;

function doSubImport(){
  var tid = document.getElementById("subTask").value;
  var parent = byId(tid); if(!parent){ toast(tr("needName")); return; }
  var lines = document.getElementById("subText").value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
  if(!lines.length){ closeSub(); return; }
  var pg = parent.group;
  lines.forEach(function(ln){
    var parts = ln.split(/[,，]/).map(function(s){ return s.trim(); });
    var sub = mkTask({ name:parts[0], group:pg, start:parent.start, dur:parts[2] ? (+parts[2]||3) : 3,
      owner:parts[1]||"", source:"sub:" + parent.id });
    // 插入到父任务后面
    var idx = state.tasks.indexOf(parent);
    state.tasks.splice(idx + 1 + (parent._subCount||0), 0, sub);
    parent._subCount = (parent._subCount||0) + 1;
  });
  // 细项默认前置链：第一条前置=父，第二条前置=第一条...
  document.getElementById("subModalBg").classList.remove("show");
  render(); toast(tr("subOk"));
}
function closeSub(){ document.getElementById("subModalBg").classList.remove("show"); }
/* ============ 导入/导出 ============ */
function exportJSON(){
  var blob = new Blob([JSON.stringify({ app:"gantt-exec", version:1, state:state, cal:{holidays:cal.holidays, makeup:Object.keys(cal.makeup)} }, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "exec-plan-" + fmtD(new Date()).replace(/-/g,"") + ".json"; a.click();
}
function importJSONFile(f){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      // 支持计划工具导出的 JSON（含 state 字段）→ 转为执行层初始任务
      if((d.app === "gantt-tool" && d.dates) || (d.state && d.state.dates)){ fromPlanData(d.state || d); return; }
      var st = d.state || d;
      if(st.tasks){ state = st; if(!state.seq) state.seq = 1000; if(!state.collapsed) state.collapsed = {}; render(); toast(tr("importOk")); }
    }catch(e){ toast("JSON parse error"); }
  };
  r.readAsText(f);
}
function exportCSV(){
  var rows = [["ID","Name","Type","Group","Start","Dur","End","Deps","Owner","Output","Progress","Remarks"]];
  flatTasks().forEach(function(t){
    rows.push([t.id, t.name, t.type, (byId(t.group)||{}).name||"", t.start, t.dur, taskEnd(t), (t.deps||[]).join(";"), t.owner, t.output, t.progress, t.remarks]);
  });
  var csv = "\ufeff" + rows.map(function(r){ return r.map(function(c){ return '"' + String(c==null?"":c).replace(/"/g,'""') + '"'; }).join(","); }).join("\n");
  var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = "exec-plan.csv"; a.click();
}
/* ============ 导出：甘特图 → PDF / JPG / 预览（风格与计划页统一：600dpi、双层表头、标题、图例、页脚日期） ============ */
var $ = function(id){ return document.getElementById(id); };
var EXPORT_DPI = 600;
function exportScale(cssW, cssH){
  var s = EXPORT_DPI / 96;
  var maxPx = 80000000; /* 浏览器 canvas 安全上限，超大图表自动降档 */
  if(cssW * cssH * s * s > maxPx) s = Math.sqrt(maxPx / (cssW * cssH));
  return s;
}
function dlURL(url, filename){
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function expFont(sz, bold){
  return (bold ? '700 ' : '') + sz + 'px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
}
function rr(ctx, x, y, w, h, r){ /* 圆角矩形路径 */
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitText(ctx, text, maxW){ /* 超宽截断加省略号 */
  text = String(text == null ? '' : text);
  if(maxW < 1) return '';
  if(ctx.measureText(text).width <= maxW) return text;
  while(text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text + '…';
}
function exportFileBase(){
  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem('gantt-tool-v1')); }catch(e){}
  var nm = (plan && plan.projectName || '').trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 40);
  if(!nm) nm = 'exec-plan';
  return nm + '_' + fmtD(new Date()).replace(/-/g, '');
}
/* 把执行页甘特图（左侧任务表：任务名称/负责人/工期/进度/开始/结束 + 右侧时间轴：任务条/里程碑菱形/阶段色带/依赖线）绘制到 canvas */
function renderExportCanvas(cb){
  var vis = visibleTasks();
  var rows = vis.length;
  var R = dateRange(), min = R.min, max = R.max;
  var days = diffDays(min, max) + 1;
  var pxDay = state.view === 'week' ? 10 : (state.view === 'month' ? PX_MONTH / 30 : 28);
  var W = days * pxDay;
  var bands = phaseAnchors();
  var BAND_H = bands.length ? 30 : 0;
  var TABLE_W = 500, HEAD_H = 44, ROW_H = 34;
  var TITLE_H = 80, LEGEND_H = 44, FOOT_H = 26;
  var bodyH = HEAD_H + BAND_H + rows * ROW_H;
  var cssW = TABLE_W + W, cssH = TITLE_H + bodyH + LEGEND_H + FOOT_H;
  var scale = exportScale(cssW, cssH);
  var c = document.createElement('canvas');
  c.width = Math.round(cssW * scale);
  c.height = Math.round(cssH * scale);
  var ctx = c.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cssW, cssH);
  function X(d){ return diffDays(min, d) * pxDay; }
  var hx = TABLE_W;               /* 时间轴原点 x */
  var bodyY = TITLE_H;            /* 表头区顶部 */
  var bandY = TITLE_H + HEAD_H; /* 阶段色带行顶部 */
  var rowY0 = bandY + BAND_H;   /* 任务行起始 y */
  var bodyBot = rowY0 + rows * ROW_H;
  var sys = state.planOem ? OEM_PHASE_SYS[state.planOem] : '';
  var NAME_W = TABLE_W - 36 - 64 - 52 - 56 - 86 - 86;
  var CX = { id:18, name:36, owner:36 + NAME_W, dur:36 + NAME_W + 64, prog:36 + NAME_W + 64 + 52, start:36 + NAME_W + 64 + 52 + 56, end:36 + NAME_W + 64 + 52 + 56 + 86 };
  var today = new Date(); today.setHours(0, 0, 0, 0);

  /* ---- 标题（优先取计划页项目名） ---- */
  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem('gantt-tool-v1')); }catch(e){}
  var title = (plan && plan.projectName) || tr('appTitle');
  ctx.fillStyle = '#111827';
  ctx.textAlign = 'center';
  ctx.font = expFont(24, true);
  ctx.fillText(title, cssW / 2, TITLE_H - 32);
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(24, TITLE_H - 14); ctx.lineTo(cssW - 24, TITLE_H - 14); ctx.stroke();

  /* ---- 左侧任务表表头（钢蓝，MS Project 风格） ---- */
  ctx.fillStyle = '#1e3a52';
  ctx.fillRect(0, bodyY, TABLE_W, HEAD_H);
  ctx.font = expFont(11, true);
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  var heads = [
    { t:'ID', x:0, w:36, ctr:true },
    { t:tr('cName'), x:CX.name, w:NAME_W, ctr:false },
    { t:tr('cOwner'), x:CX.owner, w:64, ctr:false },
    { t:tr('cDur'), x:CX.dur, w:52, ctr:true },
    { t:tr('cProg'), x:CX.prog, w:56, ctr:true },
    { t:tr('cStart'), x:CX.start, w:86, ctr:true },
    { t:tr('cEnd'), x:CX.end, w:86, ctr:true }
  ];
  heads.forEach(function(hd){
    ctx.textAlign = hd.ctr ? 'center' : 'left';
    ctx.fillText(hd.t, hd.ctr ? hd.x + hd.w / 2 : hd.x + 6, bodyY + HEAD_H / 2);
  });

  /* ---- 右侧双层日期表头（年行 + 月行） ---- */
  ctx.fillStyle = '#7BA7BC';
  ctx.fillRect(hx, bodyY, W, 22);
  ctx.fillStyle = '#BDD5E5';
  ctx.fillRect(hx, bodyY + 22, W, 22);
  ctx.textAlign = 'center';
  var yStart = min.getFullYear(), yEnd = max.getFullYear();
  ctx.font = expFont(13, true);
  ctx.fillStyle = '#ffffff';
  for(var yy = yStart; yy <= yEnd; yy++){
    var ysD = new Date(Math.max(new Date(yy, 0, 1).getTime(), min.getTime()));
    var yeD = new Date(Math.min(new Date(yy + 1, 0, 1).getTime(), max.getTime()));
    var yx1 = hx + X(ysD), yx2 = hx + X(yeD);
    ctx.fillText(String(yy), (yx1 + yx2) / 2, bodyY + 11);
    if(yy > yStart){
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(yx1, bodyY); ctx.lineTo(yx1, bodyY + 22); ctx.stroke();
    }
  }
  var monthXs = [];
  ctx.font = expFont(11, false);
  ctx.fillStyle = '#374151';
  var cur = new Date(min.getFullYear(), min.getMonth(), 1);
  var endM = new Date(max.getFullYear(), max.getMonth(), 1);
  var monAb = MON_ABBR[lang] || MON_ABBR.zh;
  while(cur <= endM){
    var mx1 = hx + X(cur);
    var nM = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    var mx2 = hx + X(nM > max ? max : nM);
    monthXs.push(mx1);
    var mName = lang === 'zh' ? (cur.getMonth() + 1) + '月' : monAb[cur.getMonth() + 1];
    ctx.fillText(mName, (mx1 + mx2) / 2, bodyY + 33);
    cur = nM;
  }
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
  monthXs.forEach(function(mx){
    ctx.beginPath(); ctx.moveTo(mx, bodyY + 22); ctx.lineTo(mx, bodyY + 44); ctx.stroke();
  });
  ctx.textBaseline = 'alphabetic';
  /* 表头内日分隔线（日/周视图） */
  if(state.view !== 'month'){
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
    for(var di = 0; di <= days; di++){
      var dx = hx + di * pxDay;
      ctx.beginPath(); ctx.moveTo(dx, bodyY); ctx.lineTo(dx, bodyY + HEAD_H); ctx.stroke();
    }
  }
  /* 表头/主体分界 + 表-轴分界 */
  ctx.strokeStyle = '#e5e7eb';
  ctx.beginPath(); ctx.moveTo(0, bodyY + HEAD_H - .5); ctx.lineTo(cssW, bodyY + HEAD_H - .5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(TABLE_W - .5, bodyY); ctx.lineTo(TABLE_W - .5, bodyBot); ctx.stroke();

  /* ---- 周末/节假日底纹 ---- */
  for(var j = 0; j < days; j++){
    var dd = addDays(min, j), ss = fmtD(dd), xx = hx + j * pxDay;
    if(cal.holidays[ss]){ ctx.fillStyle = '#fef2f2'; ctx.fillRect(xx, bodyY + HEAD_H, pxDay, bodyBot - bodyY - HEAD_H); }
    else if(dd.getDay() === 0 || dd.getDay() === 6){ ctx.fillStyle = '#f3f4f6'; ctx.fillRect(xx, bodyY + HEAD_H, pxDay, bodyBot - bodyY - HEAD_H); }
  }
  /* ---- 竖向网格线（日视图按日，其余按月界） ---- */
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  if(state.view === 'day'){
    for(var gi = 0; gi <= days; gi++){
      var gx = hx + gi * pxDay;
      ctx.beginPath(); ctx.moveTo(gx, bodyY + HEAD_H); ctx.lineTo(gx, bodyBot); ctx.stroke();
    }
  } else {
    monthXs.forEach(function(mx){
      ctx.beginPath(); ctx.moveTo(mx, bodyY + HEAD_H); ctx.lineTo(mx, bodyBot); ctx.stroke();
    });
  }
  ctx.setLineDash([]);

  /* ---- 阶段色带行（从里程碑计划导入后显示） ---- */
  if(bands.length){
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, bandY, TABLE_W, BAND_H);
    for(var bi = 0; bi < bands.length; bi++){
      var ba = bands[bi], bb = bands[bi + 1];
      var bx1 = hx + X(ba.d), bx2 = bb ? hx + X(bb.d) : hx + X(max);
      var bw = bx2 - bx1;
      if(bw <= 0) continue;
      ctx.fillStyle = bandShade(bi, bands.length);
      ctx.fillRect(bx1, bandY, Math.max(bw, 2), BAND_H);
      var meta = PHASE_NAMES[sys] ? PHASE_NAMES[sys][ba.pid] : null;
      var label = ba.pid + ' ' + (meta ? (meta[lang] || meta.zh) : ba.pid);
      ctx.font = expFont(10, false);
      ctx.fillStyle = '#1e3a52';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.save();
      ctx.beginPath(); ctx.rect(bx1, bandY, Math.max(bw, 2), BAND_H); ctx.clip();
      ctx.fillText(fitText(ctx, label, Math.max(bw - 8, 0)), bx1 + 4, bandY + BAND_H / 2);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
    ctx.strokeStyle = '#e5e7eb';
    ctx.beginPath(); ctx.moveTo(0, bandY + BAND_H - .5); ctx.lineTo(cssW, bandY + BAND_H - .5); ctx.stroke();
  }

  /* ---- 任务行：表格单元格 + 时间轴任务条/里程碑菱形 ---- */
  vis.forEach(function(t, ri){
    var ry = rowY0 + ri * ROW_H;
    var isGroup = t.type === 'group';
    var cy = ry + ROW_H / 2;
    if(isGroup){
      ctx.fillStyle = '#e8eef5';
      ctx.fillRect(0, ry, cssW, ROW_H);
    }
    ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ry + ROW_H - .5); ctx.lineTo(cssW, ry + ROW_H - .5); ctx.stroke();
    ctx.textBaseline = 'middle';
    /* ID */
    ctx.font = expFont(12, false);
    ctx.fillStyle = '#6b7280';
    ctx.textAlign = 'center';
    if(!isGroup) ctx.fillText(String(t.id).replace('t', ''), CX.id, cy);
    /* 任务名称 */
    ctx.textAlign = 'left';
    if(isGroup){
      ctx.font = expFont(12, true);
      ctx.fillStyle = '#1f2937';
      ctx.fillText(fitText(ctx, (state.collapsed[t.id] ? '▶ ' : '▼ ') + t.name, NAME_W - 12), CX.name + 6, cy);
    } else if(t.type === 'milestone'){
      ctx.save();
      ctx.translate(CX.name + 11, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(-5, -5, 10, 10);
      ctx.restore();
      ctx.font = expFont(12, false);
      ctx.fillStyle = '#1f2937';
      ctx.fillText(fitText(ctx, t.name, NAME_W - 26), CX.name + 20, cy);
    } else {
      ctx.font = expFont(12, false);
      ctx.fillStyle = '#1f2937';
      ctx.fillText(fitText(ctx, t.name, NAME_W - 12), CX.name + 6, cy);
    }
    /* 负责人 */
    ctx.font = expFont(12, false);
    ctx.fillStyle = '#4b5563';
    ctx.fillText(fitText(ctx, t.owner || '', 52), CX.owner + 6, cy);
    /* 工期 */
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4b5563';
    ctx.fillText(isGroup ? '' : (t.type === 'milestone' ? '◆' : String(t.dur)), CX.dur + 26, cy);
    /* 进度条 */
    if(!isGroup){
      var px = CX.prog + 6, pw = 44;
      ctx.fillStyle = '#e5e7eb';
      rr(ctx, px, cy - 4, pw, 8, 4); ctx.fill();
      if(t.progress > 0){
        ctx.fillStyle = '#2563eb';
        rr(ctx, px, cy - 4, Math.max(pw * t.progress / 100, 2), 8, 4); ctx.fill();
      }
    }
    /* 开始/结束 */
    ctx.fillStyle = '#4b5563';
    ctx.fillText(t.start || '', CX.start + 43, cy);
    ctx.fillText(isGroup ? '' : taskEnd(t), CX.end + 43, cy);
    ctx.textBaseline = 'alphabetic';
    /* 时间轴内容 */
    if(!isGroup){
      var s = parseD(t.start);
      if(s){
        if(t.type === 'milestone'){
          var mx = hx + X(s);
          ctx.save();
          ctx.translate(mx, ry + 17);
          ctx.rotate(Math.PI / 4);
          ctx.fillStyle = t.color || '#dc2626';
          ctx.fillRect(-8, -8, 16, 16);
          ctx.restore();
        } else {
          var e = parseD(taskEnd(t));
          var bx = hx + X(s);
          var bw = Math.max((diffDays(s, e) + 1) * pxDay - 4, 8);
          var by = ry + 7, bh = 20;
          ctx.fillStyle = t.color || '#2563eb';
          rr(ctx, bx, by, bw, bh, 4); ctx.fill();
          if(t.progress > 0){
            ctx.save();
            rr(ctx, bx, by, bw, bh, 4); ctx.clip();
            ctx.fillStyle = 'rgba(255,255,255,.35)';
            ctx.fillRect(bx, by, bw * t.progress / 100, bh);
            ctx.restore();
          }
          ctx.font = expFont(11, false);
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.save();
          ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
          ctx.fillText(fitText(ctx, t.name + ' ' + t.progress + '%', Math.max(bw - 10, 0)), bx + 6, by + bh / 2);
          ctx.restore();
          ctx.textBaseline = 'alphabetic';
        }
      }
    }
  });

  /* ---- 依赖线（前置 → 本任务，贝塞尔曲线） ---- */
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
  vis.forEach(function(t, ri){
    if(t.type === 'group' || !t.deps || !t.deps.length) return;
    var s = parseD(t.start); if(!s) return;
    var y2 = rowY0 + ri * ROW_H + ROW_H / 2;
    var x2 = hx + X(s);
    t.deps.forEach(function(pid){
      var p = byId(pid); if(!p || p.type === 'group') return;
      var pi = vis.indexOf(p); if(pi < 0) return;
      var pe = parseD(taskEnd(p)); if(!pe) return;
      var y1 = rowY0 + pi * ROW_H + ROW_H / 2;
      var x1 = hx + X(addDays(pe, 1));
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.bezierCurveTo(x1 + 20, y1, x2 - 20, y2, x2, y2);
      ctx.stroke();
    });
  });

  /* ---- 今天线 ---- */
  if(today >= min && today <= max){
    var tx = hx + X(today);
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
    ctx.setLineDash([5, 3]);
    ctx.beginPath(); ctx.moveTo(tx, bodyY + HEAD_H); ctx.lineTo(tx, bodyBot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = expFont(10, true);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tr('today'), Math.min(Math.max(tx, hx + 24), cssW - 24), bodyY + 11);
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 图例（按实际内容动态生成） ---- */
  var items = [], hasMs = false, hasRec = false, hasSup = false, hasCustom = false, hasOther = false, otherColor = '#2563eb';
  vis.forEach(function(t){
    if(t.type === 'group') return;
    var src = String(t.source || '');
    if(t.type === 'milestone'){
      if(src.indexOf('sup:') === 0) hasSup = true; else hasMs = true;
    } else if(src.indexOf('rec:') === 0) hasRec = true;
    else if(src === 'custom') hasCustom = true;
    else { hasOther = true; otherColor = t.color || otherColor; }
  });
  if(hasMs) items.push({ c:'#dc2626', t:tr('planGroupMs'), diamond:true });
  if(bands.length) items.push({ c:'#bfdbfe', t:tr('legendPhase'), border:'#60a5fa' });
  if(hasRec) items.push({ c:'#2563eb', t:tr('planGroupRec') });
  if(hasSup) items.push({ c:'#9333ea', t:tr('planGroupSup'), diamond:true });
  if(hasCustom) items.push({ c:'#16a34a', t:tr('planGroupCustom') });
  if(hasOther) items.push({ c:otherColor, t:tr('legendTask') });
  if(items.length){
    var legendY = TITLE_H + bodyH + 22;
    ctx.font = expFont(12, false);
    var gap = 26, widths = [], total = 0;
    items.forEach(function(it){
      var tw = ctx.measureText(it.t).width;
      widths.push(tw); total += 22 + tw + gap;
    });
    total -= gap;
    var lx = Math.max((cssW - total) / 2, 8), ly = legendY;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    items.forEach(function(it, i){
      if(it.diamond){
        ctx.save();
        ctx.translate(lx + 7, ly);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = it.c;
        ctx.fillRect(-6, -6, 12, 12);
        ctx.restore();
      } else if(it.border){
        ctx.fillStyle = it.c;
        ctx.fillRect(lx, ly - 6, 14, 12);
        ctx.strokeStyle = it.border; ctx.lineWidth = 1;
        ctx.strokeRect(lx, ly - 6, 14, 12);
      } else {
        ctx.fillStyle = it.c;
        ctx.fillRect(lx, ly - 6, 14, 12);
      }
      ctx.fillStyle = '#374151';
      ctx.fillText(it.t, lx + 22, ly);
      lx += 22 + widths[i] + gap;
    });
    ctx.textBaseline = 'alphabetic';
  }

  /* ---- 页脚：日期 ---- */
  var footY = TITLE_H + bodyH + LEGEND_H + FOOT_H / 2;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#6b7280';
  ctx.font = expFont(11, false);
  ctx.textBaseline = 'middle';
  var dLab = tr('expDate') + ':';
  ctx.fillText(dLab, 20, footY);
  ctx.fillText(fmtD(new Date()), 20 + ctx.measureText(dLab).width + 6, footY);
  ctx.textBaseline = 'alphabetic';

  cb(c, cssW, cssH);
}
/* 极简 PDF：单页 + 单张 JPEG 图；页面按 CSS 尺寸（96dpi），图片按导出 DPI = 高分辨率（与计划页同一实现） */
function buildPdf(jpeg, w, h, dispW, dispH){
  var pw = (dispW * 0.75).toFixed(2), ph = (dispH * 0.75).toFixed(2);
  var out = [];
  function bs(s){ for(var i = 0; i < s.length; i++) out.push(s.charCodeAt(i) & 255); }
  function bb(u8){ for(var j = 0; j < u8.length; j++) out.push(u8[j]); }
  function strBytes(s){ var a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; }
  var offsets = [0];
  function obj(n, dict, streamU8){
    offsets[n] = out.length;
    bs(n + ' 0 obj\n' + dict + '\nstream\n');
    if(streamU8) bb(streamU8);
    bs('\nendstream\nendobj\n');
  }
  bs('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>');
  obj(4, '<< /Type /XObject /Subtype /Image /Width ' + w + ' /Height ' + h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpeg.length + ' >>', jpeg);
  var content = 'q\n' + pw + ' 0 0 ' + ph + ' 0 0 cm\n/Im0 Do\nQ\n';
  obj(5, '<< /Length ' + content.length + ' >>', strBytes(content));
  var xrefAt = out.length, n = 6;
  bs('xref\n0 ' + n + '\n');
  bs('0000000000 65535 f \n');
  for(var k = 1; k < n; k++){
    var o = String(offsets[k]);
    while(o.length < 10) o = '0' + o;
    bs(o + ' 00000 n \n');
  }
  bs('trailer\n<< /Size ' + n + ' /Root 1 0 R >>\nstartxref\n' + xrefAt + '\n%%EOF');
  return new Uint8Array(out);
}
function exportPDF(){
  renderExportCanvas(function(canvas, cssW, cssH){
    canvas.toBlob(function(blob){
      if(!blob) return;
      var fr = new FileReader();
      fr.onload = function(){
        var pdf = buildPdf(new Uint8Array(fr.result), canvas.width, canvas.height, cssW, cssH);
        dlURL(URL.createObjectURL(new Blob([pdf], { type:'application/pdf' })), exportFileBase() + '.pdf');
      };
      fr.readAsArrayBuffer(blob);
    }, 'image/jpeg', 0.95);
  });
}
function exportJPG(){
  renderExportCanvas(function(canvas){
    canvas.toBlob(function(blob){
      if(!blob) return;
      dlURL(URL.createObjectURL(blob), exportFileBase() + '.jpg');
    }, 'image/jpeg', 0.95);
  });
}
/* ---------- 预览：与导出一致的画布渲染，模态框展示 ---------- */
function exportPreview(){
  renderExportCanvas(function(canvas){
    $('pvImg').src = canvas.toDataURL('image/jpeg', 0.95);
    $('pvModal').classList.add('open');
  });
}
function closePreview(){
  var m = $('pvModal');
  if(!m || !m.classList.contains('open')) return;
  m.classList.remove('open');
  $('pvImg').removeAttribute('src');
}
/* 从里程碑计划导入：客户里程碑 + 推荐任务 + 供应商节点排 + 自定义任务，全量带入 */
function planRecCfg(p, id){
  var d = (typeof REC_DEFAULTS !== "undefined" && REC_DEFAULTS[id]) || {so:0, eo:0};
  var o = (p.recTasks && p.recTasks[id]) || {};
  return {
    on: o.on !== undefined ? !!o.on : true,
    so: (typeof o.so === "number" && !isNaN(o.so)) ? o.so : d.so,
    eo: (typeof o.eo === "number" && !isNaN(o.eo)) ? o.eo : d.eo
  };
}
function planResolveAnchor(name, nodeNames){
  if(!name) return null;
  var i;
  for(i = 0; i < nodeNames.length; i++){ if(nodeNames[i] === name) return nodeNames[i]; }
  var norm = function(x){ return String(x).toLowerCase().replace(/\s+/g, ""); };
  var target = norm(name);
  for(i = 0; i < nodeNames.length; i++){ if(norm(nodeNames[i]) === target) return nodeNames[i]; }
  return null;
}
function planPickName(o){ return (o && (o[lang] || o.zh)) || ""; }
function fromPlan(){
  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem("gantt-tool-v1")); }catch(e){}
  if(!plan || !plan.oem){ toast(tr("noPlan")); return; }
  fromPlanData(plan);
}
function fromPlanData(p){
  if(!p || !p.oem){ toast(tr("noPlan")); return; }
  state.tasks = []; state.seq = 1; state.collapsed = {}; state.planOem = p.oem;
  var n = 0, nodeNames = Object.keys(p.dates || {});
  function grp(name){ var g = mkTask({ name:name, type:"group" }); state.tasks.push(g); return g; }
  // 1) 客户里程碑（已勾选节点）
  var gMs = grp(tr("planGroupMs"));
  nodeNames.forEach(function(nm){
    if(p.excluded && p.excluded[nm]) return;
    if(!p.dates[nm]) return;
    state.tasks.push(mkTask({ name:nm, type:"milestone", group:gMs.id, start:p.dates[nm], dur:0, source:"ms:" + nm, color:"#dc2626" }));
    n++;
  });
  // 2) 推荐任务（按锚点+周偏移推算起止，换算为工作日工期）
  var sys = (typeof OEM_PHASE_SYS !== "undefined" && OEM_PHASE_SYS[p.oem]) || "apqp";
  var phases = (typeof OEM_PHASES !== "undefined" && OEM_PHASES[p.oem]) || {};
  var gRec = null;
  (typeof REC_TASKS !== "undefined" ? REC_TASKS : []).forEach(function(rt){
    var cfg = planRecCfg(p, rt.id);
    if(!cfg.on) return;
    var pk = (rt.phase && (rt.phase[sys] || rt.phase.apqp)) || "";
    var anchor = planResolveAnchor(phases[pk], nodeNames);
    if(!anchor || (p.excluded && p.excluded[anchor]) || !p.dates[anchor]) return;
    var ad = parseD(p.dates[anchor]); if(!ad) return;
    var sd = addDays(ad, cfg.so * 7), ed = addDays(ad, cfg.eo * 7);
    if(ed < sd) return;
    if(!gRec) gRec = grp(tr("planGroupRec"));
    state.tasks.push(mkTask({ name:planPickName(rt.name), type:"task", group:gRec.id,
      start:fmtD(sd), dur:workdaysBetween(sd, ed) + 1, source:"rec:" + rt.id, color:"#2563eb" }));
    n++;
  });
  // 3) 供应商节点排：每排一组，排内日期为里程碑
  (p.customMs || []).forEach(function(row){
    if(!row || !row.dates || !row.dates.length) return;
    var g = grp(row.name || tr("planGroupSup"));
    row.dates.forEach(function(it){
      if(!it || !it.d) return;
      state.tasks.push(mkTask({ name:it.n || row.name || "", type:"milestone", group:g.id,
        start:it.d, dur:0, source:"sup:" + (row.name || ""), color:"#9333ea" }));
      n++;
    });
  });
  // 4) 自定义任务
  var gCustom = null;
  (p.tasks || []).forEach(function(ct){
    if(!ct || !ct.name || !ct.start || !ct.end) return;
    var sd = parseD(ct.start), ed = parseD(ct.end);
    if(!sd || !ed || ed < sd) return;
    if(!gCustom) gCustom = grp(tr("planGroupCustom"));
    state.tasks.push(mkTask({ name:ct.name, type:"task", group:gCustom.id,
      start:fmtD(sd), dur:workdaysBetween(sd, ed) + 1, source:"custom", color:"#16a34a" }));
    n++;
  });
  toast(tr("fromPlanOk") + " · " + n); render();
}
/* ============ 回写里程碑计划（手动双向同步：执行页 → 计划页） ============ */
function syncBack(){
  var plan = null;
  try{ plan = JSON.parse(localStorage.getItem("gantt-tool-v1")); }catch(e){}
  if(!plan){ toast(tr("syncBackFail")); return; }
  var n = 0;
  state.tasks.forEach(function(t){
    if(t.type !== "milestone") return;
    var src = String(t.source || "");
    if(src.indexOf("ms:") !== 0) return;
    var nm = src.slice(3);
    var d = parseD(t.start);
    if(!d) return;
    if(plan.dates){ plan.dates[nm] = fmtD(d); n++; }
  });
  if(!n){ toast(tr("syncBackEmpty")); return; }
  plan.execSyncAt = Date.now();
  try{ localStorage.setItem("gantt-tool-v1", JSON.stringify(plan)); }catch(e){ toast(tr("syncBackFail")); return; }
  toast(tr("syncBackOk"));
}
/* ============ 工作日历面板 ============ */
function updateCalSummary(){
  var h = Object.keys(cal.holidays).length, m = Object.keys(cal.makeup).length;
  document.getElementById("calSummary").textContent = "节假日 " + h + " 天 · 调休上班 " + m + " 天";
}
var calMode = "nl";
function setCalMode(m){
  calMode = m;
  document.getElementById("calModeNL").classList.toggle("on", m === "nl");
  document.getElementById("calModeText").classList.toggle("on", m === "text");
  document.querySelector(".cal-panel .hint[data-i18n]").textContent = tr(m === "text" ? "calHintText" : "calHint");
  document.getElementById("calInput").placeholder = tr(m === "text" ? "calPhText" : "calPh");
  if(m === "text") document.getElementById("calInput").value = calToText();
  document.getElementById("calPreview").innerHTML = "";
}
function doCalParse(){
  var text = document.getElementById("calInput").value.trim();
  if(!text) return;
  var r = calMode === "text" ? parseCalText(text) : parseCalNL(text);
  var hks = Object.keys(r.holidays), mks = r.makeup;
  var html = "";
  if(hks.length) html += "<div>放假 " + hks.length + " 天：" + hks.slice(0, 12).join("、") + (hks.length > 12 ? "…" : "") + "</div>";
  if(mks.length) html += "<div>调休上班 " + mks.length + " 天：" + mks.join("、") + "</div>";
  if(!hks.length && !mks.length) html = "<div>未识别出日期</div>";
  else html += '<div style="margin-top:6px"><button id="btnCalApply" style="background:var(--accent)">确认应用</button></div>';
  document.getElementById("calPreview").innerHTML = html;
  var b = document.getElementById("btnCalApply");
  if(b) b.addEventListener("click", function(){
    hks.forEach(function(k){ cal.holidays[k] = r.holidays[k] || 1; });
    mks.forEach(function(k){ cal.makeup[k] = 1; });
    document.getElementById("calPreview").innerHTML = "";
    document.getElementById("calInput").value = "";
    save(); render(); toast(tr("calApplied"));
  });
}
/* ============ 初始化 ============ */
function init(){
  var urlOem = "";
  try{
    var u = new URL(location.href), lg = u.searchParams.get("lang");
    if(lg === "zh" || lg === "en" || lg === "de") lang = lg;
    urlOem = oemFromSlug(u.searchParams.get("oem"));
  }catch(e){}
  load(); applyLang();
  /* URL 带 oem 参数（或里程碑计划数据含 OEM）时，初始化后自动从计划导入一次；无计划数据走现有 noPlan 提示 */
  var planOem = "";
  try{ var _plan = JSON.parse(localStorage.getItem("gantt-tool-v1")); if(_plan && _plan.oem) planOem = _plan.oem; }catch(e){}
  if(urlOem || planOem) fromPlan();
  render();
  document.querySelectorAll(".langbtns button").forEach(function(b){
    b.addEventListener("click", function(){ lang = b.dataset.lang; applyLang(); render(); });
  });
  document.getElementById("btnBack").addEventListener("click", function(){ location.href = "index.html?lang=" + lang; });
  document.getElementById("btnAdd").addEventListener("click", function(){ selId = null; openModal(null); });
  document.getElementById("btnAddGroup").addEventListener("click", function(){
    var t = mkTask({ name:"新分组", type:"group" }); state.tasks.push(t); render();
  });
  document.getElementById("btnAddMs").addEventListener("click", function(){
    selId = null; editId = null;
    openModal(null);
    setTimeout(function(){ var s = document.getElementById("fType"); if(s) s.value = "milestone"; }, 60);
  });
  document.querySelectorAll(".viewbtns button").forEach(function(b){
    b.addEventListener("click", function(){
      state.view = b.dataset.view;
      document.querySelectorAll(".viewbtns button").forEach(function(x){ x.classList.toggle("on", x === b); });
      render();
    });
  });
  document.getElementById("btnFromPlan").addEventListener("click", fromPlan);
  document.getElementById("btnSyncBack").addEventListener("click", syncBack);
  document.getElementById("btnImportSub").addEventListener("click", openSubModal);
  document.getElementById("btnExport").addEventListener("click", exportJSON);
  document.getElementById("btnPDF").addEventListener("click", exportPDF);
  document.getElementById("btnJPG").addEventListener("click", exportJPG);
  document.getElementById("btnPreview").addEventListener("click", exportPreview);
  document.getElementById("pvClose").addEventListener("click", closePreview);
  document.getElementById("pvModal").addEventListener("click", function(e){ if(e.target === this) closePreview(); });
  document.getElementById("btnCSV").addEventListener("click", exportCSV);
  document.getElementById("btnImport").addEventListener("click", function(){ document.getElementById("fileJSON").click(); });
  document.getElementById("fileJSON").addEventListener("change", function(){ if(this.files[0]) importJSONFile(this.files[0]); this.value = ""; });
  document.getElementById("btnCal").addEventListener("click", function(){
    var p = document.getElementById("calPanel"); p.style.display = p.style.display === "none" ? "" : "none";
  });
  document.getElementById("btnCalParse").addEventListener("click", doCalParse);
  document.getElementById("btnCalReset").addEventListener("click", function(){
    resetCal(); updateCalSummary(); save(); render(); toast(tr("calApplied"));
    if(calMode === "text") document.getElementById("calInput").value = calToText();
    document.getElementById("calPreview").innerHTML = "";
  });
  document.getElementById("calModeNL").addEventListener("click", function(){ setCalMode("nl"); });
  document.getElementById("calModeText").addEventListener("click", function(){ setCalMode("text"); });
  setCalMode("nl");
  updateCalSummary();
  document.getElementById("modalX").addEventListener("click", closeModal);
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalOk").addEventListener("click", saveModal);
  document.getElementById("modalDel").addEventListener("click", function(){
    if(editId){ state.tasks = state.tasks.filter(function(t){ return t.id !== editId; }); }
    closeModal(); render();
  });
  document.getElementById("modalBg").addEventListener("click", function(e){ if(e.target === this) closeModal(); });
  document.getElementById("subX").addEventListener("click", closeSub);
  document.getElementById("subCancel").addEventListener("click", closeSub);
  document.getElementById("subOk").addEventListener("click", doSubImport);
  document.getElementById("subModalBg").addEventListener("click", function(e){ if(e.target === this) closeSub(); });
  document.getElementById("subFile").addEventListener("change", function(){
    var f = this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){ document.getElementById("subText").value = r.result; };
    r.readAsText(f); this.value = "";
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closeModal(); closeSub(); closePreview(); } });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
})();

</script>
